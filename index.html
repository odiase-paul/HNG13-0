<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://api.fontshare.com/v2/css?f[]=clash-display@200,300,400,500,600,700,1&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Profile Card</title>
  </head>
  <body>
    <article class="profile-card" data-testid="test-profile-card">
      <header class="top-title" data-testid="title">
        <h1>Profile Card</h1>
      </header>

      <!-- contact me and about me page -->

      <nav class="navbar">
        <ul>
          <li>
            <a href="aboutMe.html" target="_blank">About Me</a>
          </li>
          <li>
            <a href="contactUs.html" target="_blank">Contact Us</a>
          </li>
        </ul>
      </nav>

      <figure class="figure-div">
        <div class="profile-image-div">
          <div class="profile-image">
            <img
              src="avatar/face.jpg"
              alt="Profile picture of Paul Odiase"
              data-testid="test-user-avatar"
            />
          </div>

          <figcaption>
            <input
              type="file"
              id="avatar-upload"
              accept="image/*"
              data-testid="test-avatar-upload"
            />
          </figcaption>
        </div>

        <div class="figure-text-div">
          <header class="user-name">
            <h2 data-testid="test-user-name">Paul Odiase</h2>
          </header>
          <p data-testid="test-user-bio">
            A passionate and result driven frontend developer who enjoys
            building accessible and user friendly web interfaces. Proficient in
            HTML5, CSS, Tailwind, JavaScript, React.js etc.
          </p>
          <p class="time">
            Current Time (ms):
            <span data-testid="test-user-time"></span>
          </p>
        </div>
      </figure>

      <nav class="page-body" aria-label="Social media links">
        <ul class="social-links" data-testid="test-user-social-links">
          <li>
            <a
              href="https://x.com/OdiaseAkhere"
              target="_blank"
              rel="noopener noreferrer"
              data-testid="test-user-social-twitter"
            >
              Twitter
            </a>
          </li>
          <li>
            <a
              href="https://github.com/odiase-paul"
              target="_blank"
              rel="noopener noreferrer"
              data-testid="test-user-social-github"
            >
              GitHub
            </a>
          </li>
          <li>
            <a
              href="https://www.linkedin.com/in/paul-odiase-799603236"
              target="_blank"
              rel="noopener noreferrer"
              data-testid="test-user-social-linkedin"
            >
              LinkedIn
            </a>
          </li>
        </ul>
      </nav>

      <section class="page-body" aria-labelledby="hobbies-title">
        <h3 id="hobbies-title">Hobbies</h3>
        <ul data-testid="test-user-hobbies">
          <li>Coding</li>
          <li>Movies</li>
          <li>Football</li>
        </ul>
      </section>

      <section class="page-body" aria-labelledby="dislikes-title">
        <h3 id="dislikes-title">Dislikes</h3>
        <ul data-testid="test-user-dislikes">
          <li>Procrastination</li>
          <li>Noisy environments</li>
          <li>Human abuse</li>
        </ul>
      </section>
    </article>

    <script src="script.js"></script>
  </body>
</html>
